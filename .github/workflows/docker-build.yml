name: build dockerCopilot Docker

on:
  push:
    branches: [latest]
    paths:
      - version
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: docker-build-dockercopilot
  cancel-in-progress: false

# 与 release.yml 相互独立：两者都由 version 文件变更触发，本工作流只负责 Docker 镜像。

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build Docker Image
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read Docker Copilot version
        run: |
          RAW_VERSION=$(tr -d '\r\n' < version)
          if [[ ! "$RAW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version 格式无效: $RAW_VERSION" >&2
            exit 1
          fi
          APP_VERSION="${RAW_VERSION#v}"
          echo "app_version=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Docker Copilot Version: $APP_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build backend
        run: |
          VERSION=$(tr -d '\r\n' < version)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/onlyLTY/dockerCopilot/internal/config.Version=${VERSION} -X github.com/onlyLTY/dockerCopilot/internal/config.BuildDate=${BUILD_DATE}"
          mkdir -p build/backend/linux/amd64 build/backend/linux/arm64
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="$LDFLAGS" -o ../build/backend/linux/amd64/dockerCopilot .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="$LDFLAGS" -o ../build/backend/linux/arm64/dockerCopilot .

      - name: Prepare Docker build context
        run: |
          rm -rf build/docker
          mkdir -p build/docker/dist/linux/amd64
          mkdir -p build/docker/dist/linux/arm64
          mkdir -p build/docker/etc
          mkdir -p build/docker/web
          cp build/backend/linux/amd64/dockerCopilot build/docker/dist/linux/amd64/dockerCopilot
          cp build/backend/linux/arm64/dockerCopilot build/docker/dist/linux/arm64/dockerCopilot
          cp -R backend/etc/. build/docker/etc/
          cp -R build/frontend/browser/. build/docker/web/
          test -f docker/Dockerfile
          test -f build/docker/etc/dockerCopilot.yaml
          test -f build/docker/web/index.html
          test -f backend/start.sh

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=dockercopilot
          cache-to: type=gha,mode=max,scope=dockercopilot
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/myown:dc-xia
            ${{ secrets.DOCKER_USERNAME }}/myown:dc-${{ env.app_version }}
